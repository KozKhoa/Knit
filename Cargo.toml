[workspace]
resolver = "2"
members = [
    "crates/knit-core",
    "crates/knit-archive",
    "crates/knit-manga",
    "crates/knit-renamer",
    "crates/knit-pdf",
    "crates/knit-docs",
    "src-tauri",
]
default-members = [
    "crates/knit-core",
    "crates/knit-archive",
    "crates/knit-manga",
    "crates/knit-renamer",
    "crates/knit-pdf",
    "crates/knit-docs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.12"
regex = "1.13"
globset = "0.4"
unicode-normalization = "0.1.26"
dirs = "7.0"
fs4 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
oxideav-avif = "0.0.18"
lopdf = "0.47"
hayro = "0.9"
ab_glyph = "0.2"
imageproc = "0.27"
pulldown-cmark = "0.13"
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
epub = "2.1"
zip = "9.5"
tar = "0.4"
flate2 = "1.1"
zstd = "0.13"
csv = "1.3"
tempfile = "3.19"
uuid = { version = "1.16", features = ["v4"] }
chrono = "0.4"
walkdir = "2.5"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
