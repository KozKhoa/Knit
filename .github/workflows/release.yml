name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: "--bundles appimage,deb"
          - os: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Knit ${{ github.ref_name }}"
          args: ${{ matrix.args }}
          releaseDraft: true
      - name: Package portable Windows executable
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          EXE=""
          for cand in target/release/knit-desktop.exe target/release/Knit.exe src-tauri/target/release/knit-desktop.exe src-tauri/target/release/Knit.exe; do
            if [ -f "$cand" ]; then
              EXE="$cand"
              break
            fi
          done
          test -n "$EXE"
          mkdir -p portable-out
          cp "$EXE" "portable-out/Knit_${VER}_x64-portable.exe"
      - name: Upload portable Windows executable to release
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" portable-out/*.exe --repo "${{ github.repository }}" --clobber

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --draft=false --latest
